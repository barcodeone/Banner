<!DOCTYPE html>
<html lang="ko">
<!-- saved from url=(0014)about:internet -->
<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta charset="utf-8" />
    <title>(주)가온 웍스 배너</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');
        
        html, body {
            margin: 0 !important;
            padding: 0 !important;
            overflow: hidden !important;
            width: 100%;
            height: 100%;
            background-color: transparent !important;
        }
        .banner-card {
            display: flex;
            align-items: center;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #FFFFFF 0%, #F5F7FF 60%, #E8EFFF 100%);
            border-radius: 8px;
            padding: 0 14px;
            text-decoration: none;
            transition: all 0.2s ease-in-out;
            user-select: none;
            border: 1px solid #D2E3FC;
            cursor: pointer;
        }
        .banner-card:hover {
            filter: brightness(0.98);
            border-color: #AECBFA;
            box-shadow: 0 2px 8px rgba(25, 118, 210, 0.08);
            transform: translateY(-1px);
        }
        .icon-container {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            background-color: #E8F0FE;
            border-radius: 50%;
            margin-right: 12px;
            transition: transform 0.2s ease;
        }
        .banner-card:hover .icon-container {
            transform: scale(1.05);
        }
        .icon-svg {
            width: 18px;
            height: 18px;
            fill: #1976D2;
        }
        .text-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .title {
            font-size: 13.5px;
            font-weight: 700;
            color: #1976D2;
            margin-bottom: 2px;
        }
        .subtitle {
            font-size: 10.5px;
            font-weight: 500;
            color: #4285F4;
        }
    </style>
</head>
<body>
    <div class="banner-card" onclick="alert('(주)가온 웍스\n컨테이너하우스, 이동식화장실 제작 및 납품\n\n연락처: 031-768-3366')">
        <div class="icon-container">
            <svg class="icon-svg" viewBox="0 0 24 24">
                <!-- Home / Construction Icon -->
                <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
            </svg>
        </div>
        <div class="text-container">
            <span class="title">(주)가온 웍스</span>
            <span class="subtitle">컨테이너하우스, 이동식화장실 제작 및 납품 (031-768-3366)</span>
        </div>
    </div>
</body>
</html>
